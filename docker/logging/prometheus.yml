global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "gostrategy-backend"
    static_configs:
      - targets: ["retail-row.home:80"]
    metrics_path: /metrics

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "retail-row.home:9100"
          - "lonely-lodge.home:9100"
          - "adguard-home.home:9100"
          - "tailscale.home:9100"

