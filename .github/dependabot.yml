version: 2
updates:
  # GitHub Actions & composite actions
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    target-branch: "main"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(actions)"
    groups:
      actions:
        patterns:
          - "*"

  # Scripts (Go modules)
  - package-ecosystem: "gomod"
    directories:
      - "/scripts/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    target-branch: "main"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      go:
        patterns:
          - "*"

  # docker compose
  - package-ecosystem: "docker-compose"
    directories:
      - "/docker/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    target-branch: "main"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker:
        patterns:
          - "*"